<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>勇太の紹介サイト</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>勇太のポートフォリオ</h1>
        <nav>
            <ul>
                <li><a href="#about">プロフィール</a></li>
                <li><a href="#skills">スキル</a></li>
                <li><a href="#contact">お問い合わせ</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section id="about">
            <h2>プロフィール</h2>
            <div class="profile-content">
                <img src="profile-image.jpg" alt="勇太の写真">
                <div class="profile-text">
                    <p>はじめまして、勇太です。</p>
                    <p>ここにプロフィールの詳細を記入してください。</p>
                </div>
            </div>
        </section>

        <section id="skills">
            <h2>スキル</h2>
            <ul class="skills-list">
                <li>スキル1</li>
                <li>スキル2</li>
                <li>スキル3</li>
            </ul>
        </section>

        <section id="contact">
            <h2>お問い合わせ</h2>
            <form>
                <input type="email" placeholder="メールアドレス">
                <textarea placeholder="メッセージ"></textarea>
                <button type="submit">送信</button>
            </form>
        </section>
    </main>

    <footer>
        <p>&copy; 2024 勇太のポートフォリオ</p>
    </footer>
</body>
</html>
